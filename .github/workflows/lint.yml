name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install linters
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        if: success() || failure()
        run: npm run lint:css

      - name: Lint JavaScript
        if: success() || failure()
        run: npm run lint:js